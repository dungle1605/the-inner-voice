version: '3.8'

services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: inner-voice-ai-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  backend-service:
    build:
      context: ./backend-service
      dockerfile: Dockerfile
    container_name: inner-voice-backend
    ports:
      - "5000:5000"
    environment:
      - AiService__BaseUrl=http://ai-service:8000
      - ConnectionStrings__DefaultConnection=Data Source=innervoice.db
    depends_on:
      - ai-service
    restart: unless-stopped

  ui-client:
    build:
      context: ./ui-client
      dockerfile: Dockerfile
    container_name: inner-voice-ui
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend-service:5000/api/chat
    depends_on:
      - backend-service
    restart: unless-stopped

